<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Chat</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #topbar {
      padding: 10px;
      background: #1b1b1b;
      border-bottom: 1px solid #333;
    }

    #nameInput, #adminPass {
      width: 200px;
      padding: 8px;
      background: #222;
      color: white;
      border: 1px solid #444;
      margin-top: 5px;
    }

    #adminBtn {
      margin-top: 5px;
      padding: 6px 10px;
      background: gold;
      color: black;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      margin-bottom: 10px;
      background: #1e1e1e;
      padding: 8px;
      border-radius: 8px;
    }

    .name {
      font-weight: bold;
      color: #4da3ff;
    }

    .crown {
      color: gold;
      margin-left: 5px;
    }

    .deleteBtn {
      margin-top: 5px;
      background: red;
      border: none;
      color: white;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 5px;
    }

    #bottom {
      display: flex;
      padding: 10px;
      gap: 10px;
      background: #1b1b1b;
    }

    #messageInput {
      flex: 1;
      padding: 10px;
      background: #222;
      color: white;
      border: 1px solid #444;
    }

    button {
      padding: 10px 20px;
      background: #4da3ff;
      border: none;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="topbar">
    Naam:
    <input id="nameInput" placeholder="jouw naam">

    <br>

    <input id="adminPass" type="password" placeholder="admin wachtwoord">
    <button id="adminBtn">Login als admin</button>
  </div>

  <div id="messages"></div>

  <div id="bottom">
    <input id="messageInput" placeholder="bericht">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const nameInput = document.getElementById("nameInput");
    const adminPass = document.getElementById("adminPass");
    const adminBtn = document.getElementById("adminBtn");

    let isAdmin = localStorage.getItem("isAdmin") === "true";

    nameInput.value = localStorage.getItem("chat_name") || "";

    nameInput.addEventListener("input", () => {
      localStorage.setItem("chat_name", nameInput.value);
    });

    adminBtn.onclick = () => {
      if (adminPass.value === "nederlandbeste!!47") {
        isAdmin = true;
        localStorage.setItem("isAdmin", "true");
        alert("Je bent nu admin 👑");
      } else {
        alert("Fout wachtwoord");
      }
    };

    function addMessage(data) {
      const div = document.createElement("div");
      div.className = "msg";
      div.dataset.id = data.id;

      let crown = data.isAdmin ? `<span class="crown">👑</span>` : "";

      div.innerHTML = `
        <div class="name">${data.name} ${crown}</div>
        <div>${data.message}</div>
        ${isAdmin ? `<button class="deleteBtn" onclick="deleteMessage('${data.id}')">🗑️</button>` : ""}
      `;

      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    socket.on("load_messages", (messages) => {
      messagesDiv.innerHTML = "";
      messages.forEach(addMessage);
    });

    socket.on("chat_message", (data) => {
      addMessage(data);
    });

    socket.on("message_deleted", (id) => {
      const el = document.querySelector(`[data-id="${id}"]`);
      if (el) el.remove();
    });

    function sendMessage() {
      const name = nameInput.value.trim();
      const message = messageInput.value.trim();

      if (!name || !message) return;

      socket.emit("chat_message", {
        id: Date.now().toString(),
        name,
        message,
        isAdmin
      });

      messageInput.value = "";
    }

    function deleteMessage(id) {
      socket.emit("delete_message", {
        id,
        isAdmin
      });
    }

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
