<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Chat</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #topbar {
      padding: 10px;
      background: #1b1b1b;
      border-bottom: 1px solid #333;
    }

    #nameInput {
      width: 200px;
      padding: 8px;
      background: #222;
      color: white;
      border: 1px solid #444;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      margin-bottom: 10px;
      background: #1e1e1e;
      padding: 8px;
      border-radius: 8px;
    }

    .name {
      font-weight: bold;
      color: #4da3ff;
    }

    .deleteBtn {
      margin-top: 5px;
      background: red;
      border: none;
      color: white;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 5px;
    }

    #bottom {
      display: flex;
      padding: 10px;
      gap: 10px;
      background: #1b1b1b;
    }

    #messageInput {
      flex: 1;
      padding: 10px;
      background: #222;
      color: white;
      border: 1px solid #444;
    }

    button {
      padding: 10px 20px;
      background: #4da3ff;
      border: none;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="topbar">
    Naam:
    <input id="nameInput" placeholder="jouw naam">
  </div>

  <div id="messages"></div>

  <div id="bottom">
    <input id="messageInput" placeholder="bericht">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const nameInput = document.getElementById("nameInput");

    // 🔥 SINGLE SOURCE OF TRUTH
    let messages = JSON.parse(localStorage.getItem("messages") || "[]");

    // naam opslaan
    nameInput.value = localStorage.getItem("chat_name") || "";

    nameInput.addEventListener("input", () => {
      localStorage.setItem("chat_name", nameInput.value);
    });

    function save() {
      localStorage.setItem("messages", JSON.stringify(messages));
    }

    function renderAll() {
      messagesDiv.innerHTML = "";
      messages.forEach(addMessage);
    }

    function addMessage(data) {
      const div = document.createElement("div");
      div.className = "msg";
      div.dataset.id = data.id;

      div.innerHTML = `
        <div class="name">${data.name}</div>
        <div>${data.message}</div>
        <button class="deleteBtn" onclick="deleteMessage('${data.id}')">🗑️</button>
      `;

      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // init render
    renderAll();

    // server load
    socket.on("load_messages", (serverMessages) => {
      messages = serverMessages.slice(-100);
      save();
      renderAll();
    });

    // incoming message
    socket.on("chat_message", (data) => {

      const msg = {
        id: Date.now().toString(),
        ...data
      };

      messages.push(msg);

      if (messages.length > 100) {
        messages = messages.slice(-100);
      }

      save();
      addMessage(msg);
    });

    // send (ORIGINEEL GEDRAG)
    function sendMessage() {
      const name = nameInput.value.trim();
      const message = messageInput.value.trim();

      if (!name || !message) return;

      socket.emit("chat_message", {
        name,
        message
      });

      messageInput.value = "";
    }

    // ✅ DELETE FIX (BELANGRIJK)
    function deleteMessage(id) {
      messages = messages.filter(m => m.id !== id);
      save();
      renderAll();
    }

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>
</html>
